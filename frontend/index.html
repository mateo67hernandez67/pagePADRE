<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de automatizaciones</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --rojo:       #e52222;
  --rojo-dark:  #b81a1a;
  --rojo-soft:  #ffeaea;
  --gris-bg:    #1a1a1a;
  --gris-panel: #242424;
  --gris-card:  #2e2e2e;
  --gris-borde: #3a3a3a;
  --gris-texto: #c8c8c8;
  --blanco:     #ffffff;
  --verde:      #22c55e;
  --amarillo:   #f59e0b;
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--gris-bg);
  color: var(--gris-texto);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* ── Sidebar ── */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--gris-panel);
  border-right: 1px solid var(--gris-borde);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 1px solid var(--gris-borde);
}
.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
}
.sidebar-logo-dot {
  width: 28px; height: 28px; border-radius: 6px;
  background: var(--rojo);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 800; color: white;
}
.sidebar-title { font-size: 14px; font-weight: 700; color: var(--blanco); }
.sidebar-sub   { font-size: 11px; color: #666; }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 0; }
.nav-section-label {
  font-size: 10px; font-weight: 700; letter-spacing: 0.8px;
  text-transform: uppercase; color: #555;
  padding: 12px 16px 4px;
}

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px; cursor: pointer;
  font-size: 13px; color: var(--gris-texto);
  border-left: 3px solid transparent;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  user-select: none;
}
.nav-item:hover { background: var(--gris-card); color: var(--blanco); }
.nav-item.active {
  background: rgba(229,34,34,0.12);
  color: var(--blanco);
  border-left-color: var(--rojo);
}
.nav-item-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #444; flex-shrink: 0;
}
.nav-item.active .nav-item-dot { background: var(--rojo); }
.nav-item-name { flex: 1; }
.nav-item-badge {
  font-size: 10px; padding: 1px 5px; border-radius: 3px;
  background: var(--gris-borde); color: #888;
}
.nav-item-badge.correo { background: rgba(229,34,34,0.2); color: #ff6b6b; }
.nav-item-badge.auto   { background: rgba(34,197,94,0.15); color: #4ade80; }

.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--gris-borde);
  font-size: 11px; color: #555;
  display: flex; align-items: center; gap: 6px;
}
.agente-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: #555; flex-shrink: 0;
}
.agente-dot.ok { background: var(--verde); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
.agente-dot.error { background: var(--rojo); }

/* ── Main area ── */
.main {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden;
}
.main-header {
  padding: 16px 24px;
  border-bottom: 1px solid var(--gris-borde);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--gris-panel);
  flex-shrink: 0;
}
.main-header-left { display: flex; flex-direction: column; gap: 2px; }
.main-header-title { font-size: 16px; font-weight: 700; color: var(--blanco); }
.main-header-desc  { font-size: 12px; color: #666; }
.main-header-actions { display: flex; gap: 8px; }

.main-content { flex: 1; overflow-y: auto; padding: 24px; }

/* ── Botones ── */
.btn {
  padding: 8px 16px; border-radius: 7px; border: none;
  cursor: pointer; font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px;
  transition: opacity 0.15s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-primary  { background: var(--rojo); color: white; }
.btn-primary:hover:not(:disabled) { background: var(--rojo-dark); }
.btn-ghost    { background: var(--gris-card); color: var(--gris-texto); border: 1px solid var(--gris-borde); }
.btn-ghost:hover:not(:disabled) { background: #3a3a3a; color: var(--blanco); }
.btn-danger   { background: #7f1d1d; color: #fca5a5; }
.btn-success  { background: #14532d; color: #86efac; }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* ── Cards de ejecución ── */
.exec-list { display: flex; flex-direction: column; gap: 12px; }
.exec-card {
  background: var(--gris-card);
  border: 1px solid var(--gris-borde);
  border-radius: 10px; padding: 14px 16px;
}
.exec-card.activo { border-color: var(--rojo); }
.exec-card-header {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap; margin-bottom: 10px;
}
.exec-numero { font-size: 11px; color: #555; font-family: monospace; }
.exec-tiempo { font-size: 11px; color: #555; margin-left: auto; }

/* chips de estado */
.chip {
  font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
  padding: 3px 9px; border-radius: 20px; text-transform: uppercase;
}
.chip-pendiente            { background: rgba(229,34,34,0.15); color: #ff6b6b; }
.chip-ejecutando           { background: rgba(34,197,94,0.15); color: #4ade80; }
.chip-esperando_confirmacion{ background: rgba(245,158,11,0.15); color: #fbbf24; }
.chip-finalizado           { background: rgba(34,197,94,0.1); color: #4ade80; }
.chip-error                { background: rgba(229,34,34,0.2); color: #fca5a5; }
.chip-cancelando, .chip-cancelado { background: var(--gris-borde); color: #666; }

/* Terminal */
pre.terminal {
  background: #111; color: #ccc;
  padding: 12px 14px; border-radius: 8px;
  max-height: 250px; overflow-y: auto;
  font-size: 12px; font-family: 'Cascadia Code','Fira Code','Consolas',monospace;
  white-space: pre-wrap; word-break: break-all;
  border: 1px solid #1e1e1e; margin-bottom: 10px;
}
pre.terminal:empty { display: none; }

.exec-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.exec-aviso { font-size: 12px; padding: 4px 0; }
.aviso-ok    { color: var(--verde); }
.aviso-error { color: #fca5a5; }
.aviso-warn  { color: var(--amarillo); }
.aviso-info  { color: #666; }

/* Confirmación de correo */
.confirm-box {
  background: rgba(229,34,34,0.06);
  border: 1px solid rgba(229,34,34,0.25);
  border-radius: 8px; padding: 12px 14px;
  margin-bottom: 8px;
}
.confirm-box p { font-size: 13px; color: #ccc; margin-bottom: 10px; }

/* ── Tabla de resultados de Verificar Cierres ── */
.resultado-cierres {
  background: var(--gris-card);
  border: 1px solid var(--gris-borde);
  border-radius: 10px; padding: 16px;
  margin-bottom: 16px;
}
.resultado-cierres h3 {
  font-size: 14px; font-weight: 700; color: var(--blanco);
  margin-bottom: 4px;
}
.resultado-cierres .fechas {
  font-size: 12px; color: #666; margin-bottom: 12px;
}
.resultado-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.resultado-table th {
  background: #1e1e1e; padding: 8px 10px;
  text-align: left; font-weight: 600; color: #888;
  border-bottom: 1px solid var(--gris-borde);
}
.resultado-table td {
  padding: 8px 10px; border-bottom: 1px solid #2a2a2a;
}
.resultado-table tr:last-child td { border-bottom: none; }
.resumen-global {
  margin-top: 12px; padding: 10px 14px;
  border-radius: 7px; font-size: 13px; font-weight: 600;
}
.resumen-ok    { background: rgba(34,197,94,0.1); color: var(--verde); }
.resumen-error { background: rgba(229,34,34,0.12); color: #ff6b6b; }

/* ── Spinner / pulso ── */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 2px solid #3a3a3a; border-top-color: var(--verde);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle; margin-right: 4px;
}
.pulsando { animation: pulse 1.5s ease-in-out infinite; }

/* ── Vacío ── */
.empty-state {
  text-align: center; padding: 48px 24px;
  color: #444; font-size: 14px;
}
.empty-icon { font-size: 32px; margin-bottom: 8px; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #3a3a3a; border-radius: 3px; }
</style>
</head>
<body>

<!-- ════════════════════ SIDEBAR ════════════════════ -->
<aside class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-logo">
      <div class="sidebar-logo-dot">A</div>
      <div>
        <div class="sidebar-title">Automatizaciones</div>
        <div class="sidebar-sub">Panel de control</div>
      </div>
    </div>
  </div>

  <nav class="sidebar-nav" id="sidebar-nav">
    <div class="nav-section-label">Scripts</div>
    <!-- Se genera dinámicamente -->
    <div style="padding:12px 16px;font-size:12px;color:#555">Cargando...</div>
  </nav>

  <div class="sidebar-footer">
    <div class="agente-dot" id="agente-dot"></div>
    <span id="agente-texto">Verificando...</span>
  </div>
</aside>

<!-- ════════════════════ MAIN ════════════════════ -->
<div class="main">
  <div class="main-header">
    <div class="main-header-left">
      <div class="main-header-title" id="header-title">Selecciona un script</div>
      <div class="main-header-desc"  id="header-desc">Elige una automatización de la lista</div>
    </div>
    <div class="main-header-actions">
      <button class="btn btn-primary" id="btn-ejecutar" style="display:none" onclick="ejecutarScript()">
        ▶ Ejecutar
      </button>
    </div>
  </div>

  <div class="main-content" id="main-content">
    <div class="empty-state">
      <div class="empty-icon">⚙</div>
      <div>Selecciona un script en la barra lateral para ver sus ejecuciones.</div>
    </div>
  </div>
</div>

<script>
const BACKEND_URL = "https://pagepadre-akhc.onrender.com";

// Estado global
let scripts = [];
let scriptActual = null;       // objeto script seleccionado
let jobsActivos = {};          // job_id → intervalId
let jobsVistaPorScript = {};   // script_id → [job_id, ...]

// ─── API ────────────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const r = await fetch(BACKEND_URL + path, opts);
  if (!r.ok) throw new Error(`HTTP ${r.status} en ${path}`);
  return r.json();
}

// ─── Inicialización ──────────────────────────────────────────────────────────
async function init() {
  await cargarScripts();
  verificarAgente();
  setInterval(verificarAgente, 30000);
}

async function verificarAgente() {
  try {
    const jobs = await api("/jobs?limite=10");
    const activo = jobs.some(j =>
      ["ejecutando","esperando_confirmacion","pendiente"].includes(j.estado)
    );
    document.getElementById("agente-dot").className = "agente-dot " + (activo ? "ok" : "");
    document.getElementById("agente-texto").textContent = activo ? "Agente activo" : "Agente en espera";
  } catch {
    document.getElementById("agente-dot").className = "agente-dot error";
    document.getElementById("agente-texto").textContent = "Sin conexión";
  }
}

async function cargarScripts() {
  try {
    scripts = await api("/scripts");
  } catch (e) {
    document.getElementById("sidebar-nav").innerHTML =
      '<div style="padding:12px 16px;font-size:12px;color:#f55">Error al cargar scripts</div>';
    return;
  }

  const nav = document.getElementById("sidebar-nav");
  nav.innerHTML = '<div class="nav-section-label">Scripts</div>';

  for (const s of scripts) {
    const tipo = s.tipo_envio || "ninguno";
    const badge = tipo === "correo" ? "correo" : tipo === "automatico" ? "auto" : "";
    const badgeText = tipo === "correo" ? "✉" : tipo === "automatico" ? "⚡" : "";

    const item = document.createElement("div");
    item.className = "nav-item";
    item.dataset.id = s._id;
    item.innerHTML = `
      <div class="nav-item-dot"></div>
      <span class="nav-item-name">${s.nombre}</span>
      ${badge ? `<span class="nav-item-badge ${badge}">${badgeText}</span>` : ""}
    `;
    item.onclick = () => seleccionarScript(s);
    nav.appendChild(item);
  }
}

// ─── Seleccionar script ──────────────────────────────────────────────────────
async function seleccionarScript(s) {
  scriptActual = s;

  // Actualizar sidebar
  document.querySelectorAll(".nav-item").forEach(el => {
    el.classList.toggle("active", el.dataset.id === s._id);
  });

  // Actualizar header
  document.getElementById("header-title").textContent = s.nombre;
  document.getElementById("header-desc").textContent  = s.descripcion || "";
  document.getElementById("btn-ejecutar").style.display = "inline-flex";

  // Renderizar vista
  await renderizarVistaScript(s);
}

// ─── Renderizar vista de un script ──────────────────────────────────────────
async function renderizarVistaScript(s) {
  const content = document.getElementById("main-content");
  content.innerHTML = '<div style="color:#555;font-size:13px">Cargando ejecuciones...</div>';

  let jobs = [];
  try {
    jobs = await api(`/jobs/por-script/${s._id}`);
  } catch (e) {
    content.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠</div><div>${e.message}</div></div>`;
    return;
  }

  if (!jobs.length) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <div>Sin ejecuciones todavía.<br>Presiona <strong>Ejecutar</strong> para comenzar.</div>
      </div>`;
    return;
  }

  content.innerHTML = '<div class="exec-list" id="exec-list"></div>';
  for (const [idx, job] of jobs.entries()) {
    crearTarjetaJob(job, idx + 1, jobs.length);
    if (["pendiente","ejecutando","esperando_confirmacion","cancelando"].includes(job.estado)) {
      monitorearJob(job._id, job.tipo_envio || "ninguno");
    }
  }
}
</script>

<script>
// ─── Tarjeta de ejecución ─────────────────────────────────────────────────
function crearTarjetaJob(job, numero, total) {
  const lista = document.getElementById("exec-list");
  if (!lista || document.getElementById(`job-${job._id}`)) return;

  const div = document.createElement("div");
  div.className = "exec-card";
  div.id = `job-${job._id}`;
  div.dataset.tipoEnvio = job.tipo_envio || "ninguno";

  const ts = job.creado_en ? new Date(job.creado_en).toLocaleString("es-CO") : "";
  div.innerHTML = `
    <div class="exec-card-header">
      <span class="exec-numero">Ejecución #${total - numero + 1}</span>
      <span class="chip chip-${job.estado} ${["pendiente","ejecutando"].includes(job.estado) ? "pulsando" : ""}"
            id="chip-${job._id}">${etiqueta(job.estado)}</span>
      <span class="exec-tiempo" id="tiempo-${job._id}"></span>
      <span style="font-size:11px;color:#444;margin-left:4px">${ts}</span>
      <button title="Eliminar esta ejecución"
              onclick="eliminarEjecucion('${job._id}', this)"
              style="margin-left:auto;background:none;border:none;cursor:pointer;
                     color:#444;font-size:16px;line-height:1;padding:2px 4px;
                     border-radius:4px;transition:color 0.15s"
              onmouseover="this.style.color='#ff6b6b'"
              onmouseout="this.style.color='#444'">✕</button>
    </div>
    <pre class="terminal" id="terminal-${job._id}"></pre>
    <div id="resultado-${job._id}"></div>
    <div id="acciones-${job._id}" class="exec-actions"></div>
    <div id="aviso-${job._id}" class="exec-aviso"></div>
  `;
  lista.appendChild(div);
  actualizarTarjeta(job._id, job);
}

// ─── Actualizar tarjeta ───────────────────────────────────────────────────
function actualizarTarjeta(jobId, job) {
  const chip = document.getElementById(`chip-${jobId}`);
  if (!chip) return;

  chip.textContent = etiqueta(job.estado);
  chip.className = `chip chip-${job.estado}`;
  if (["pendiente","ejecutando"].includes(job.estado)) chip.classList.add("pulsando");

  // Tiempo transcurrido
  if (job.iniciado_en) {
    const ini = new Date(job.iniciado_en);
    const fin = job.finalizado_en ? new Date(job.finalizado_en) : new Date();
    const seg = Math.floor((fin - ini) / 1000);
    const el  = document.getElementById(`tiempo-${jobId}`);
    if (el) el.textContent = seg >= 60 ? `${Math.floor(seg/60)}m ${seg%60}s` : `${seg}s`;
  }

  // Terminal
  const term = document.getElementById(`terminal-${jobId}`);
  if (term && job.logs?.length) {
    term.textContent = job.logs.join("\n");
    term.scrollTop = term.scrollHeight;
  }

  // Resultado especial de Verificar Cierres
  const resEl = document.getElementById(`resultado-${jobId}`);
  if (resEl && job.datos_resultado) {
    resEl.innerHTML = renderResultadoCierres(job.datos_resultado);
  }

  // Acciones y avisos
  const accEl  = document.getElementById(`acciones-${jobId}`);
  const avisoEl = document.getElementById(`aviso-${jobId}`);
  const tipo   = job.tipo_envio || document.getElementById(`job-${jobId}`)?.dataset.tipoEnvio || "ninguno";

  accEl.innerHTML = "";
  avisoEl.innerHTML = "";

  if (["pendiente","ejecutando"].includes(job.estado)) {
    accEl.innerHTML = `<button class="btn btn-danger btn-sm" onclick="cancelar('${jobId}')">✕ Cancelar</button>`;
  } else if (job.estado === "esperando_confirmacion" && !job.accion_usuario) {
    accEl.innerHTML = `
      <div class="confirm-box">
        <p>✅ <strong>${job.nombre_script || ""}</strong> finalizó. ¿Enviamos el correo?</p>
        <div style="display:flex;gap:8px">
          <button class="btn btn-primary btn-sm" onclick="decidir('${jobId}','enviar_correo')">
            ✉ Sí, enviar correo
          </button>
          <button class="btn btn-ghost btn-sm" onclick="decidir('${jobId}','reejecutar_sin_correo')">
            ↩ No, reejecutar
          </button>
        </div>
      </div>`;
  }

  if (job.estado === "error") {
    avisoEl.innerHTML = `<span class="aviso-error">✘ ${job.error_mensaje || "Error desconocido"}</span>`;
  } else if (job.estado === "cancelando") {
    avisoEl.innerHTML = `<span class="aviso-warn">⏳ Cancelando...</span>`;
  } else if (job.estado === "cancelado") {
    avisoEl.innerHTML = `<span class="aviso-info">Cancelado.</span>`;
  } else if (job.estado === "finalizado" && tipo === "ninguno") {
    avisoEl.innerHTML = `<span class="aviso-ok">✔ Completado correctamente.</span>`;
  }

  if (job.estado_correo === "enviado") {
    const f = job.correo_enviado_en ? " · " + new Date(job.correo_enviado_en).toLocaleString("es-CO") : "";
    avisoEl.innerHTML = `<span class="aviso-ok">✉ Correo enviado${f}</span>`;
  } else if (job.estado_correo === "error_envio") {
    avisoEl.innerHTML = `<span class="aviso-error">✘ Falló el envío del correo.</span>`;
  }

  // Marcar card activa
  const card = document.getElementById(`job-${jobId}`);
  if (card) card.classList.toggle("activo",
    ["pendiente","ejecutando","esperando_confirmacion","cancelando"].includes(job.estado));
}
</script>

<script>
// ─── Resultado de Verificar Cierres ──────────────────────────────────────
function renderResultadoCierres(datos) {
  const ok = datos.todos_correctos;
  const fechas = (datos.fechas_esperadas || []).join(", ");

  let filas = "";
  for (const h of datos.hojas || []) {
    const color = h.estado === "CORRECTO" ? "var(--verde)" :
                  h.estado === "ERROR"    ? "var(--amarillo)" : "var(--rojo)";
    const icono = h.estado === "CORRECTO" ? "✅" : h.estado === "ERROR" ? "⚠️" : "❌";
    const faltantes = h.fechas_faltantes?.length ? h.fechas_faltantes.join(", ") : "—";
    filas += `
      <tr>
        <td style="font-weight:600;color:var(--blanco)">${h.hoja}</td>
        <td><span style="color:${color}">${icono} ${h.estado}</span></td>
        <td style="font-size:12px;color:#aaa">${h.detalle}</td>
        <td style="font-size:12px;color:#ff6b6b">${faltantes === "—" ? '<span style="color:#555">—</span>' : faltantes}</td>
      </tr>`;
  }

  return `
    <div class="resultado-cierres">
      <h3>Resultado de Verificación de Cierres</h3>
      <div class="fechas">Fechas verificadas: ${fechas}</div>
      <table class="resultado-table">
        <thead>
          <tr>
            <th>Hoja</th><th>Estado</th><th>Detalle</th><th>Fechas faltantes</th>
          </tr>
        </thead>
        <tbody>${filas}</tbody>
      </table>
      <div class="resumen-global ${ok ? 'resumen-ok' : 'resumen-error'}">
        ${ok ? '✅ Todos los cierres están correctos' : '❌ Hay problemas en uno o más cierres'}
      </div>
    </div>`;
}

// ─── Polling ──────────────────────────────────────────────────────────────
function monitorearJob(jobId, tipoEnvio) {
  if (jobsActivos[jobId]) return;
  const ESTADOS_FIN = ["finalizado","cancelado","error"];

  jobsActivos[jobId] = setInterval(async () => {
    try {
      const job = await api(`/jobs/${jobId}`);
      actualizarTarjeta(jobId, job);

      if (ESTADOS_FIN.includes(job.estado)) {
        clearInterval(jobsActivos[jobId]);
        delete jobsActivos[jobId];
        verificarAgente();
        // Si el script activo es el mismo, refrescar la vista para ver historial
        if (scriptActual && job.script_id === scriptActual._id) {
          setTimeout(() => renderizarVistaScript(scriptActual), 1000);
        }
      }
    } catch (e) { console.error("Error polling", jobId, e); }
  }, 2500);
}

// ─── Ejecutar script ──────────────────────────────────────────────────────
async function ejecutarScript() {
  if (!scriptActual) return;
  const btn = document.getElementById("btn-ejecutar");
  btn.disabled = true;

  try {
    const { job_id } = await api(`/jobs?script_id=${scriptActual._id}`, { method: "POST" });
    await renderizarVistaScript(scriptActual);
    // Buscar el job recién creado y monitorearlo
    setTimeout(async () => {
      try {
        const job = await api(`/jobs/${job_id}`);
        monitorearJob(job_id, job.tipo_envio || "ninguno");
      } catch {}
    }, 500);
  } catch (e) {
    alert(`No se pudo ejecutar: ${e.message}`);
  } finally {
    setTimeout(() => { btn.disabled = false; }, 3000);
  }
}

// ─── Cancelar ────────────────────────────────────────────────────────────
async function cancelar(jobId) {
  try {
    await api(`/jobs/${jobId}/cancelar`, { method: "POST" });
    document.getElementById(`aviso-${jobId}`).innerHTML =
      `<span class="aviso-warn">⏳ Cancelando...</span>`;
    document.getElementById(`acciones-${jobId}`).innerHTML = "";
  } catch { alert("No se pudo cancelar."); }
}

// ─── Decidir envío ────────────────────────────────────────────────────────
async function decidir(jobId, accion) {
  try {
    await api(`/jobs/${jobId}/action?accion=${accion}`, { method: "POST" });
    document.getElementById(`acciones-${jobId}`).innerHTML =
      `<span style="font-size:12px;color:#666"><span class="spinner"></span>Procesando...</span>`;
    if (!jobsActivos[jobId]) {
      const tipo = document.getElementById(`job-${jobId}`)?.dataset.tipoEnvio || "ninguno";
      monitorearJob(jobId, tipo);
    }
  } catch { alert("No se pudo registrar la acción."); }
}

// ─── Etiquetas ────────────────────────────────────────────────────────────
function etiqueta(estado) {
  return {
    pendiente: "pendiente",
    ejecutando: "ejecutando",
    esperando_confirmacion: "esperando confirmación",
    finalizado: "finalizado",
    error: "error",
    cancelando: "cancelando",
    cancelado: "cancelado",
  }[estado] || estado;
}

// ─── Eliminar ejecución individual ────────────────────────────────────────
async function eliminarEjecucion(jobId, btnEl) {
  // Si hay un intervalo activo, no permitir borrar
  if (jobsActivos[jobId]) {
    alert("No se puede eliminar una ejecución activa.");
    return;
  }
  // Animar y eliminar en backend
  const card = document.getElementById(`job-${jobId}`);
  if (card) {
    card.style.opacity = "0.4";
    card.style.transition = "opacity 0.2s";
  }
  try {
    // Reusar el endpoint de historial pero solo para este job específico
    // Como no hay endpoint individual, usamos el de limpiar solo ese job
    await api(`/jobs/${jobId}/eliminar`, { method: "DELETE" });
  } catch {
    // Si el endpoint no existe aún, solo lo ocultamos del DOM
  }
  if (card) {
    card.style.transition = "opacity 0.3s, max-height 0.3s";
    card.style.opacity = "0";
    card.style.overflow = "hidden";
    card.style.maxHeight = card.offsetHeight + "px";
    setTimeout(() => {
      card.style.maxHeight = "0";
      card.style.marginBottom = "0";
      card.style.padding = "0";
      card.style.border = "none";
    }, 50);
    setTimeout(() => card.remove(), 400);
  }
  if (jobsActivos[jobId]) {
    clearInterval(jobsActivos[jobId]);
    delete jobsActivos[jobId];
  }
}

// ─── Arranque ─────────────────────────────────────────────────────────────
init();
</script>
